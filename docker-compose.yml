services:
  db:
    image: postgres:16
    container_name: shipment_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: shipments
    ports:
      - "5433:5432"
    volumes:
      - shipment_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: shipment_api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/shipments
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: shipment_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: shipment_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  shipment_postgres_data:
  grafana_data: